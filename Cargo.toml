[package]
name = "wx-utils"
version = "0.5.3"
description = "Translated dialogs, progress windows, shortcut editing, global hotkeys, a tray icon, and other helpers for desktop apps built with wxDragon."
license = "MIT"
readme = "README.md"
repository = "https://github.com/accessware/wx-utils"
keywords = ["wxdragon", "desktop", "utility"]
categories = ["accessibility", "gui", "localization"]
edition = "2024"

[package.metadata.patois]
translatable = true

[features]
shortcuts = ["dep:live-region", "dep:key-chord", "dep:windows"]
global-hotkeys = ["dep:key-chord", "dep:windows"]
tasks = ["dep:async-task", "dep:tokio"]
tray = ["dep:windows"]

[dependencies]
async-task = { version = "4.7.1", optional = true }
key-chord = { version = "0.2.2", optional = true }
live-region = { version = "0.3.3", optional = true }
patois = "0.3.3"
tokio = { version = "1.54.1", optional = true, default-features = false, features = ["rt-multi-thread", "sync", "time"] }
wxdragon = { version = "0.9.25", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
	"Win32_Foundation",
	"Win32_System_Threading",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "tasks"
required-features = ["tasks"]

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
