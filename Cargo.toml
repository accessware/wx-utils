[package]
name = "wx-utils"
version = "0.5.1"
description = "Translated dialogs, progress windows, shortcut editing, global hotkeys, and other helpers for desktop apps built with wxDragon."
license = "MIT"
readme = "README.md"
repository = "https://github.com/accessware/wx-utils"
keywords = ["wxdragon", "desktop", "utility"]
categories = ["accessibility", "gui", "localization"]
edition = "2024"

[package.metadata.patois]
translatable = true

[features]
shortcuts = ["dep:live-region", "dep:key-chord", "dep:windows"]
global-hotkeys = ["dep:key-chord", "dep:windows"]

[dependencies]
key-chord = { version = "0.2.2", optional = true }
live-region = { version = "0.3.3", optional = true }
patois = "0.3.0"
wxdragon = { version = "0.9.24", default-features = false }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
	"Win32_Foundation",
	"Win32_System_Threading",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_WindowsAndMessaging",
] }

[lints.clippy]
all = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
