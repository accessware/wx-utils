name: CI
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  fmt:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustfmt.toml uses nightly-only options. Pinned to Paperback's nightly, since rustfmt's output changes between nightlies.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-11-09
          components: rustfmt
      - run: cargo fmt --all --check
  check:
    name: Clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # wxdragon-sys builds wxWidgets from source on a cold cache.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install wxWidgets build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libgtk-3-dev libpng-dev libjpeg-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev libexpat1-dev libtiff-dev
      - uses: Swatinem/rust-cache@v2
        with:
          # Keeps the wxWidgets build even when a later step fails.
          cache-on-failure: true
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
  docs:
    name: Docs
    runs-on: ubuntu-latest
    env:
      # wxdragon-sys skips building wxWidgets under docs.rs.
      DOCS_RS: "1"
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
